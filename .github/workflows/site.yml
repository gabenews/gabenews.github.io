name: Сайт статистики

# Каждые 15 минут: забрать посты из Telegram, собрать зашифрованный сайт и выложить на GitHub Pages.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Расшифровать недельные отчёты
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python sync_data.py unpack

      - name: Забрать посты и собрать сайт
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SCHEDULE_SHEET_ID: ${{ secrets.SCHEDULE_SHEET_ID }}
          SITE_USERS: ${{ secrets.SITE_USERS }}
          TG_NOTIFY_TOKEN: ${{ secrets.TG_NOTIFY_TOKEN }}
          TG_NOTIFY_CHAT: ${{ secrets.TG_NOTIFY_CHAT }}
          PYTHONIOENCODING: utf-8
        run: |
          python build_site.py --export
          mkdir -p public
          cp site/index.html public/index.html
          touch public/.nojekyll

      # Выкладывается только зашифрованная страница — ни посты, ни отчёты в открытом виде сюда не попадают
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
